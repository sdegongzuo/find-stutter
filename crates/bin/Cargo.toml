[package]
name = "find-stutter"
version = "0.2.0"
edition = "2024"
description = "系统卡顿监控：GUI 悬浮窗 + agent CLI 二合一入口（无参数 = GUI；子命令 = JSON 查询 / CSV 导出 / 升级）"
# 默认 cargo run / cargo install 跑这个（GUI 入口；子命令见 find-stutter-cli）
default-run = "find-stutter"

[[bin]]
name = "find-stutter"
path = "src/main.rs"

[lib]
name = "find_stutter"
path = "src/lib.rs"

[dependencies]
find-stutter-core = { path = "../core" }
find-stutter-ui = { path = "../ui" }
find-stutter-cli = { path = "../cli" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# A/B 实验：mimalloc 全局分配器（默认关，--features mimalloc 启用）。
# 主要影响分配毛刺（趋势图整块 RGBA 缓冲、逐秒样本更新），常驻内存收益有限。
mimalloc = { version = "0.1", optional = true }

[features]
mimalloc = ["dep:mimalloc"]
