[package]
name = "find-stutter"
version = "0.2.0"
edition = "2021"
description = "System stutter monitor CLI - Slint UI overlay"

[[bin]]
name = "find-stutter"
path = "src/main.rs"

[lib]
name = "find_stutter"
path = "src/lib.rs"

[dependencies]
find-stutter-core = { path = "../core" }
find-stutter-ui = { path = "../ui" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
