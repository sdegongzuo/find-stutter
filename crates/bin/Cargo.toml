[package]
name = "find-stutter"
version = "0.1.0"
edition = "2021"
description = "System stutter monitor with floating overlay"

[[bin]]
name = "find-stutter"
path = "src/main.rs"

[lib]
name = "find_stutter"
path = "src/lib.rs"

[dependencies]
find-stutter-core = { path = "../core" }
find-stutter-ui = { path = "../ui" }
eframe = "0.30"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
