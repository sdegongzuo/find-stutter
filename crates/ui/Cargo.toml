[package]
name = "find-stutter-ui"
version = "0.2.0"
edition = "2021"
description = "System stutter monitor - Slint UI overlay (replaces egui/eframe to fix transparent-window ghosting)"
build = "build.rs"

[dependencies]
find-stutter-core = { path = "../core" }

# Slint 1.x：retained-mode 渲染 + 原生窗口层，
# 透明 overlay 移动时由 Slint 的 winit 后端处理，无 egui 即时模式逐帧 OuterPosition 更新导致的重影/闪烁
slint = { version = "1.10", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-femtovg",
    "renderer-software",
    "raw-window-handle-06",
] }

# P3：UI 只读模式直连 stutter.db
rusqlite = { version = "0.32", features = ["bundled"] }

# P3：时间戳解析（service heartbeat + stutter event timestamp）
chrono = "0.4"

# P3：stutter event snapshot 解析
serde_json = "1"

# 纯数据皮肤配置（无 UI 框架依赖）
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# 后台线程与 UI 线程同步
parking_lot = "0.12"

# 错误类型
anyhow = "1"

# 日志
log = "0.4"
env_logger = "0.11"

# 平台层（Windows 原生窗口句柄 + 点击穿透/置顶）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.10"
