[package]
name = "find-stutter-core"
version = "0.1.0"
edition = "2021"
description = "System stutter monitor - core library"

[dependencies]
sysinfo = "0.39"
windows = { version = "0.62", features = [
    "Win32_System_Performance",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
wmi = "0.18"
rusqlite = { version = "0.37", features = ["bundled"] }
csv = "1.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
windows-service = "0.8"
anyhow = "1"
serde_json = "1"
