[package]
name = "find-stutter-core"
version = "0.1.0"
edition = "2024"
description = "System stutter monitor - core library"

[dependencies]
sysinfo = "0.39"
windows = { version = "0.62", features = [
    "Win32_System_Performance",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    # elevate.rs：UAC 提权（ShellExecuteExW + "runas"，ADR-0001 下沉公共实现）
    "Win32_UI_Shell",
] }
wmi = "0.18"
rusqlite = { version = "0.40", features = ["bundled"] }
csv = "1.4"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
windows-service = "0.8"
anyhow = "1"
serde_json = "1"