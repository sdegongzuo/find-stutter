[package]
name = "find-stutter-service"
version = "0.1.0"
edition = "2021"
description = "find-stutter Windows service — 后台采集 + 写库（GUI 不再自行采集，P3 重构）"

[[bin]]
name = "find-stutter-service"
path = "src/main.rs"

[lib]
name = "find_stutter_service"
path = "src/lib.rs"

[dependencies]
find-stutter-core = { path = "../core" }

clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
ctrlc = "3"

# SCM（Service Control Manager）注册 / 启停
windows-service = "0.8"

# Windows API（SCM / 注册表 / 进程 ID）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
