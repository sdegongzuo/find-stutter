# ============================================================
# find-stutter 配置文件
# 修改后保存即可（部分字段需重启程序生效；采集阈值即时生效）
# ============================================================

[sampling]
# 采样间隔（毫秒）。默认 1000 = 每秒一次
interval_ms = 1000
# 系统空闲时的降频系数：CPU/内存持续低位时，采样间隔放大为 interval_ms * slow_interval_factor
slow_interval_factor = 5

[detection]
# CPU 使用率超过该百分比（%）即视为潜在卡顿
cpu_threshold = 90.0
# CPU 滞回（百分点）：进入卡顿需 > cpu_threshold，退出需 < cpu_threshold - cpu_hysteresis。
# 滞回带内维持当前状态，避免 CPU 在阈值附近震荡时反复记录
cpu_hysteresis = 10.0
# 内存使用率进入线（%）：超过即进入内存水位激活；退出线 = 本值 − mem_hysteresis_percent，
# 连续活跃超过 mem_chronic_seconds 后稳态抑制（停止发射 cause，回落到退出线以下才恢复）
mem_threshold_percent = 90.0
# 可用内存进入线（MB）：低于即进入内存水位激活；退出线 = 本值 × mem_available_exit_ratio
mem_threshold_mb = 500
# 提交电荷阈值（%）：已提交虚拟内存 / 提交上限（= 物理内存 + 页面文件）。
# 仅作分页（page_reads）压力证据的判定线，不作为独立卡顿 cause——commit 高只是
# 记账上限逼近，本身不影响性能；真压力由可用内存低/分页信号触发
commit_threshold_percent = 90.0
# 内存使用率滞回（百分点）：退出线 = mem_threshold_percent − 本值（默认 90 进 / 85 出）
mem_hysteresis_percent = 5.0
# 可用内存退出线比例：退出线 = mem_threshold_mb × 本值（默认 500 进 / 600 出）
mem_available_exit_ratio = 1.2
# 内存水位稳态抑制秒数：使用率/可用内存连续活跃超过该时长后停止发射内存 cause
# 并锁存，直到回落到退出线以下才解锁（水位是稳态、颠簸才是事件；
# 真颠簸由分页 cause 独立触发，不受抑制）
mem_chronic_seconds = 60
# 分页活动速率（Page Reads/sec）阈值（/s）：度量换页活动强度（流量）而非已用存量，
# 正常负载通常 < 10/s，抖动（thrashing）时飙升到数百/数千 /s。瞬时抖动大，
# 不单指标硬触发——须同时存在内存/磁盘压力证据（commit 高 / 内存使用率高 /
# 可用内存不足 / 磁盘繁忙）才记为卡顿 cause
page_reads_threshold = 300.0
# 磁盘瞬时读写速率相对均值的突增倍数：不参与实时判定（吞吐 ≠ 饱和），仅供 what-if 参考
disk_rate_spike_ratio = 10.0
# 综合指标相对基线的突增倍数
spike_ratio = 3.0
# 网络/磁盘 spike 的绝对下限（B/s）：当前速率低于该值不判定 spike，
# 避免空闲时几 B/s ~ 几十 KB/s 的零头波动按倍数误报
spike_min_bps = 2000000
# CPU spike 单样本绝对下限（%）：样本值低于该值不计入突增确认——
# 低使用率的纯比率突增（如基线 5% 涨到 16%）不构成卡顿；≥50% 的持续突增才算
spike_min_cpu_percent = 50.0
# 持续多少秒达到阈值才判定为一次卡顿（避免瞬时抖动误报）
sustained_seconds = 3
# 滞回带最长保持秒数：信号已低于进入线、仅靠滞回维持激活超过该时长即强制解除
# （滞回只防抖，不延长卡顿）；重新越过进入线即重置计时，持续真饱和不受影响
hysteresis_hold_max_secs = 15
# 采样最大 tick 间隔秒数：与上一 tick 的墙钟间隔超过该值判定为采样中断
# （系统睡眠/挂起），清空跟踪不落库，睡眠时长不计入卡顿 duration。
# 须大于空闲慢速采样间隔（interval_ms × slow_interval_factor = 5s）
max_tick_gap_secs = 15
# Windows 事件日志回溯窗口秒数：卡顿触发后只回溯 [onset − 本值, now] 的白名单事件。
# TDR/服务崩溃/磁盘错误都在卡顿当下记录，窗口过大会让无关噪音事件抢主因归因
win_event_backtrack_secs = 10
# 进程句柄泄漏判定阈值（句柄数超过即进入句柄趋势判定）
handle_leak_threshold = 10000
# 句柄增长阈值：卡顿窗口内后半段句柄均值较前半段净增超过该值才算真泄漏
# （ProcessHandleLeak）；仅绝对值高但无增长只标 HandleHigh「句柄数偏高」
# （中性提示，不误判稳定大句柄常驻服务为泄漏）
handle_leak_growth_threshold = 2000
# 进程 GDI 对象泄漏判定阈值（GDI 对象数超过即标记 GdiObjectLeak 候选）
gdi_leak_threshold = 10000
# 温度降频阈值（℃）：温度超过且频率掉档（< 峰值 × thermal_freq_drop_ratio）
# 且负载 >50% 三条件同时成立才记 ThermalThrottle cause
thermal_threshold_celsius = 85.0
# 频率掉档比例（0~1）：当前频率低于近期峰值 × 本值即视为「疑似降频」
thermal_freq_drop_ratio = 0.85
# 频率峰值衰减系数：每次频率读数时峰值 = max(当前读数, 峰值 × 本值)，
# 让短时睿频建立的峰值逐渐让位于持续负载频率（读数约 5s 一次）。
# 1.0 = 不衰减
thermal_freq_peak_decay = 0.995
# 上下文切换风暴进入线（/s/核，按逻辑核数归一）：Context Switches/sec ÷ 核数
# 超过本值才具备进入条件，且首次激活还需 CPU 侧压力证据（见下一项）。
# 绝对阈值（原 50000/s）在多核开发机上会骑在日常基线上（14 核机日常 ~45k/s，
# 33% 样本越线而退出线不可达）导致连环误报，故改为按核归一（2026-08-17 治理）
context_switch_threshold_per_core = 10000.0
# 切换风暴首次激活的 CPU 侧压力证据线（% 总使用率）：真风暴必伴随 CPU 饱和
# 或 DPC/中断越线；低 CPU 的孤立高切换只是后台异步活动，不成事件
context_switch_min_cpu_percent = 80.0

[ui]
# 皮肤名称，对应 skins 目录下的 TOML 文件（默认 "default"）
skin = "default"
# 是否置顶显示
always_on_top = true
# 各指标是否显示（可独立关闭）
show_upload = true
show_download = true
show_cpu = true
show_memory = true
show_gpu = true
show_disk = true
# 是否在详情面板显示 CPU 频率
show_cpu_freq = false
# 是否在详情面板显示温度（CPU 温度需 WMI 支持）
show_temperature = false
# 鼠标穿透（已废弃，保留兼容；实际穿透请用右键菜单「点击穿透模式」或按 T）
mouse_transparent = false
# 点击穿透模式（已废弃，保留兼容；实际穿透请用右键菜单或按 T）
click_through = false
# 启动 GUI 时是否自动检测 + 启动后台服务（含 UAC 提权）。
# 自动测试 / CI 环境建议设 false，或设环境变量 FIND_STUTTER_SKIP_SERVICE=1，
# 避免每次启动都弹 UAC 授权。
auto_start_service = true
# P2: 任务栏嵌入模式（伪任务栏窗口，横向窄条显示在屏幕底部，可拖动到任务栏位置）
taskbar = false
# 进程详情页：CPU/内存使用率超过该百分比（%）的行高亮标红
process_highlight_pct = 30.0
# 进程详情页：自动刷新间隔（毫秒），标题栏下拉可选 500/1000/2000/5000/30000
process_refresh_ms = 30000

[storage]
# SQLite 数据库文件路径
db_path = "stutter.db"
# 数据保留天数，超过自动清理
retention_days = 30
# stutter_events（及软件根因子表）独立保留天数：与 samples 的 30 天不同周期（PRD §3.4.6）
event_retention_days = 7

[notifications]
# 检测到卡顿是否弹出提醒
stutter_alert = true
# 提醒的最低严重程度：minor / major / critical
min_severity = "major"

[logging]
# 日志级别：error / warn / info / debug / trace
level = "info"
