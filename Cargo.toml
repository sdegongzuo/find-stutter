[workspace]
# 成员顺序即依赖层次：core（基础库）→ ui（GUI 库）/ cli（agent 查询库）→ bin（入口）→ service（SCM 服务）。
# ADR-0001：ui 给人、cli 给 agent，bin 只做分发。
members = [
    "crates/core",
    "crates/ui",
    "crates/cli",
    "crates/bin",
    "crates/service",
]
resolver = "2"

[profile.release]
# 资源占用优化：thin LTO + 单 codegen unit + 剥离符号表。
# 显著缩小 exe 体积（此前 ~23MB），减少磁盘占用、加快启动，并略微降低
# 常驻私有内存。构建耗时略增，仅影响 release（开发迭代走 debug 不受影响）。
lto = "thin"
codegen-units = 1
strip = "symbols"
